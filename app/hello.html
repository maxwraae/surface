<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hello</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #fafaf7;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    max-width: 540px;
    padding: 3rem;
    line-height: 1.55;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 1.5rem;
  }
  p {
    font-size: 1.05rem;
    color: #3a3a3a;
    margin: 0 0 1rem;
  }
  p.aside {
    color: #888;
    font-size: 0.95rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>
<main>
  <h1>hello from a local file</h1>
  <p>You're looking at a plain HTML file rendered by Chromium in a Surface window.</p>
  <p>This file knows nothing about Surface. Drag it into any browser — it renders identically. Surface is just a clean way to open it.</p>
  <p class="aside">Chrome is the editor. Surface opens it.</p>
</main>
</body>
</html>
